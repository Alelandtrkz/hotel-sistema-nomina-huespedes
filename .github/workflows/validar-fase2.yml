name: Validaciones Hotel Unicornio

on:
  push:
    branches: [fase2-cuentas-estadias-historial]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Node.js de pruebas
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revisar sintaxis JavaScript
        run: |
          node --check app.js
          node --check cloud.js
          node --check cash.js
      - name: Probar vuelto y caja (fase 1)
        run: node tests/fase1.test.cjs
      - name: Probar cuenta, cargos, ampliación, cierre e historial (fase 2)
        run: node tests/fase2.test.cjs
      - name: Probar recuperación segura del administrador
        run: node tests/auth-recovery.test.cjs
      - name: Verificar un cliente con varias habitaciones
        run: node tests/multihabitacion.test.cjs
      - name: Comprobar mapa e indicadores de habitaciones
        run: node tests/rooms-overview.test.cjs
      - name: Comprobar fechas y reporte imprimible de camarería
        run: node tests/room-date-housekeeping.test.cjs
      - name: Comprobar búsqueda de huéspedes en Reservas
        run: node tests/reservas-buscador.test.cjs
      - name: Verificar cuenta compacta, desayunos y escaneo de varios
        run: node tests/cuenta-habitacion-v018.test.cjs
      - name: Verificar turnos automáticos y formularios compactos
        run: node tests/cuenta-compacta-v019.test.cjs
      - name: Probar persona adicional sin nombre y fecha actual del turno
        run: node tests/cuenta-persona-v020.test.cjs
      - name: Probar inventario por ubicaciones y escáner de conteo
        run: node tests/inventario-escaner-v021.test.cjs
      - name: Verificar segunda tanda de códigos EAN y catálogo
        run: node tests/catalogo-tanda2-v022.test.cjs
      - name: Probar facturación al huésped y nómina de emisión externa
        run: node tests/facturas-nomina-v023.test.cjs
      - name: Validar abonos parciales y salida con saldo restante
        run: node tests/salidas-abonos-cierre-v024.test.cjs
      - name: Validar límite de abono y vuelto sobre efectivo recibido
        run: node tests/abono-vuelto-maximo-v025.test.cjs
      - name: Verificar saldo fijo a cobrar y abonos sin campo duplicado
        run: node tests/saldo-fijo-abono-v026.test.cjs
      - name: Verificar catálogo en zonas, filtros y conservación del stock
        run: node tests/varios-zonas-v027.test.cjs

      - name: Validar seguridad y estadísticas del panel gerencial
        run: node tests/admin-gerencial-v028.test.cjs

      - name: Probar apertura, arqueo, traspaso y cierre por turnos
        run: node tests/caja-apertura-handover-v029.test.cjs

      - name: Probar consumos en habitaciones arrendadas
        run: node tests/cargos-habitaciones-arrendadas-v031.test.cjs
