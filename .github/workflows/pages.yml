name: Publicar demo del Hotel Unicornio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Revisar sintaxis antes de publicar
        run: |
          node --check app.js
          node --check cloud.js
          node --check admin.js
          node --check cash.js
      - name: Probar fase 1 y fase 2 antes de publicar
        run: |
          node tests/fase1.test.cjs
          node tests/fase2.test.cjs
          node tests/auth-recovery.test.cjs
          node tests/multihabitacion.test.cjs
          node tests/rooms-overview.test.cjs
          node tests/room-date-housekeeping.test.cjs
          node tests/reservas-buscador.test.cjs
          node tests/cuenta-habitacion-v018.test.cjs
          node tests/cuenta-compacta-v019.test.cjs
          node tests/cuenta-persona-v020.test.cjs
          node tests/inventario-escaner-v021.test.cjs
          node tests/catalogo-tanda2-v022.test.cjs
          node tests/facturas-nomina-v023.test.cjs
          node tests/salidas-abonos-cierre-v024.test.cjs
          node tests/abono-vuelto-maximo-v025.test.cjs
          node tests/saldo-fijo-abono-v026.test.cjs
          node tests/varios-zonas-v027.test.cjs
          node tests/admin-gerencial-v028.test.cjs
          node tests/caja-apertura-handover-v029.test.cjs
          node tests/cargos-habitaciones-arrendadas-v031.test.cjs
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar archivos estáticos
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4