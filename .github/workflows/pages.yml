name: Publicar demo del Hotel Unicornio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Revisar sintaxis antes de publicar
        run: |
          node --check app.js
          node --check cloud.js
      - name: Probar fase 1 y fase 2 antes de publicar
        run: |
          node tests/fase1.test.cjs
          node tests/fase2.test.cjs
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar archivos estáticos
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4